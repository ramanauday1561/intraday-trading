name: Analyse & deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "7-59/10 3-10 * * 1-5"   # every 10 min (off the busy :00 slots), ~08:37-16:30 IST on weekdays; GitHub may delay or skip
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      USE_FINBERT: ${{ vars.USE_FINBERT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Install FinBERT (optional)
        if: env.USE_FINBERT == '1'
        run: pip install -r requirements-finbert.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Run engine (live data, demo fallback)
        run: python -W ignore -m engine.run --out data/signals.json
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest .nojekyll assets icons data _site/
      - name: Push notifications for new signals
        continue-on-error: true
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
        run: python -m engine.notify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Print results (compact)
        if: always()
        run: |
          python - <<'PY'
          import json
          try:
              s = json.load(open("data/signals.json"))
              print("SIGNALS mode:", s["meta"]["mode"], "health:", s["meta"].get("health"))
          except Exception as e:
              print("SIGNALS unreadable:", e)
          from collections import Counter
          sig = s.get("signals", []) if isinstance(s, dict) else []
          print("SIGNALS phase:", s["meta"]["session_phase"], "data as of:", s["meta"]["data_as_of"],
                "final:", dict(Counter(x["direction"] for x in sig)), "bias:", dict(Counter(x["bias"] for x in sig)))
          print("SIGNALS blockers:", dict(Counter(b["code"] for x in sig for b in x["risk"]["blockers"])))
          for x in sorted(sig, key=lambda x: -abs(x["composite"]))[:8]:
              print("  ", x["symbol"], x["bias"], "->", x["direction"], "composite", x["composite"], [b["code"] for b in x["risk"]["blockers"]])
          PY
