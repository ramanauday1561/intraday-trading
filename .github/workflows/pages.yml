name: Analyse & deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 3-10 * * 1-5"   # every 10 min, 08:30-16:00 IST on weekdays
  workflow_dispatch:
    inputs:
      backtest_date:
        description: "Backtest date (YYYY-MM-DD, must be a past trading day within ~30 days)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      USE_FINBERT: ${{ vars.USE_FINBERT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Install FinBERT (optional)
        if: env.USE_FINBERT == '1'
        run: pip install -r requirements-finbert.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Run engine (live data, demo fallback)
        run: python -W ignore -m engine.run --out data/signals.json
      - name: Backtest (causal scan 10:00-14:30 IST)
        continue-on-error: true
        env:
          BT_DATE: ${{ inputs.backtest_date || vars.BACKTEST_DATE || '2026-10-23' }}
        run: python -W ignore -m engine.backtest --date "$BT_DATE" --time 10:00 --out data/backtest.json
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest .nojekyll assets icons data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Print results (compact)
        if: always()
        run: |
          python - <<'PY'
          import json
          try:
              s = json.load(open("data/signals.json"))
              print("SIGNALS mode:", s["meta"]["mode"], "health:", s["meta"].get("health"))
          except Exception as e:
              print("SIGNALS unreadable:", e)
          try:
              b = json.load(open("data/backtest.json"))
              print("BACKTEST", b["date"], b["mode"], b["scan"], "summary:", b["summary"])
              print("BACKTEST blockers:", b["signals"][0])
              for t in b["trades"]:
                  print("TRADE", t["symbol"], t["direction"], t["signal_time"], t["entry"], "->", t["exit"], t["reason"], "qty", t["qty"], "R", t["r_multiple"], "net", t["net_pnl"])
          except Exception as e:
              print("BACKTEST unreadable:", e)
          PY
