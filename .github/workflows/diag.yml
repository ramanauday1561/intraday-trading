name: Diagnostics (data span / replay a day)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Replay one session (YYYY-MM-DD) and show why each stock did or did not signal. Empty = data-span check."
        required: false

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Data span
        if: inputs.date == ''
        run: python -W ignore -m engine.backtest --diag 2>&1 | grep "^diag"
      - name: Replay one session
        if: inputs.date != ''
        run: python -W ignore -m engine.backtest --date "${{ inputs.date }}" --out /tmp/replay.json 2>&1 | grep -E "^(REPLAY|hypothesis|with_news|without_news)"
