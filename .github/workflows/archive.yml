name: Archive market data

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Optional: space-separated session dates to (re)add to the track record, e.g. 2026-10-28 2026-10-29"
        required: false
  schedule:
    - cron: "45 10 * * 1-5"   # 16:15 IST, after the close

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch latest 5-minute bars and headlines, merge into archive/
        run: python -W ignore -m engine.archive
      - name: Replay the latest completed session and add it to the track record
        continue-on-error: true
        env:
          DATES: ${{ inputs.dates }}
        run: |
          # Default: the latest complete session in the archive, not the calendar date (runs can be hours late).
          LAST=$(python -m engine.archive --last-session)
          for D in ${DATES:-$LAST}; do
            echo "== replay $D"
            if python -W ignore -m engine.backtest --date "$D" --out /tmp/day.json | grep -E "^(REPLAY TRADE|with_news)"; then :; fi
            if [ -f /tmp/day.json ]; then python -m engine.track --day /tmp/day.json --out data/track_record.json; rm -f /tmp/day.json; fi
          done
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive data/track_record.json 2>/dev/null || git add archive
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Archive market data $(date -u +%F)"
          git pull --rebase origin main
          git push
          du -sh archive
