name: Archive market data

on:
  workflow_dispatch:
  schedule:
    - cron: "45 10 * * 1-5"   # 16:15 IST, after the close

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch latest 5-minute bars and headlines, merge into archive/
        run: python -W ignore -m engine.archive
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Archive market data $(date -u +%F)"
          git pull --rebase origin main
          git push
          du -sh archive
